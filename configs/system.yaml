# GeoAnchor runtime -- the one file all three layers read.
#
# Each layer reads only its own section, so there is no shared mutable state
# between the processes. The dashboard changes values at runtime by sending a
# control message; nothing is written back here, so a restart always returns
# to this known state.

session:
  tag: sydney_replay
  runs_dir: runs

bus:
  # ipc:// is a unix socket -- lowest overhead, same machine only.
  # Swap any of these for tcp://0.0.0.0:5561 to run a layer on another box.
  data_pub:       ipc:///tmp/geoanchor/data.sock
  processing_pub: ipc:///tmp/geoanchor/processing.sock
  output_pub:     ipc:///tmp/geoanchor/output.sock
  data_ctl:       ipc:///tmp/geoanchor/data.ctl
  processing_ctl: ipc:///tmp/geoanchor/processing.ctl
  output_ctl:     ipc:///tmp/geoanchor/output.ctl

# ---------------------------------------------------------------------------
data_layer:
  map:
    source: data/sydney/ref_tile.tif
    store_dir: stores
    # Descriptors are baked into the store, so changing `method` here forces a
    # rebuild and the processing layer must use the same one. The store id
    # carries the method name, so the two can never silently disagree.
    method: edgepoint2_s64
    tile_px: 1024          # about 127 m on this tile; roughly 1.5x the footprint
    overlap_px: 128        # so a frame on a tile seam still finds one whole tile
    max_keypoints: 2048    # per tile. 25 tiles x 2048 = 51k reference keypoints
    rebuild: false

  feed:
    type: file             # file | uvc | rtsp
    path: demo/flight.mp4
    sidecar: demo/flight_gt.jsonl   # per-frame truth, replay only
    # PUBLISH RATE. `auto` paces the feed to whatever the processing layer
    # actually sustains on this board, so no board needs a hand-tuned number.
    #
    # It is a latency knob, not a throughput one. The processing layer
    # conflates -- drain(keep_latest_of=[T_FRAME]) keeps only the newest queued
    # frame -- so publishing faster than the board can match does not buy
    # fixes, it buys a frame that has been sitting in the queue. Measured on
    # the Xavier, 8 Sept 2026, edgepoint2_s64, ~410 ms per fix:
    #
    #     fps   fixes/s   latency med   staleness   err_m med
    #       2      2.01         390.6        12.1      0.0057
    #       4      2.60         506.5       136.0      0.0057
    #       8      2.49         462.7        66.5      0.0059
    #      16      2.23         482.0        45.3      0.0057
    #      30      1.87         712.5       190.2      0.0059
    #
    # "staleness" is latency minus the summed stage_ms. It falls again above
    # 4 fps because a fuller queue means a fresher newest, then reverses at 30
    # where the data layer is encoding frames nobody will match on the same
    # cores and compute itself rises 379 -> 518 ms.
    #
    # `auto` targets the left-hand side: publish one frame every
    # (median stage_ms x fps_margin), so the CONSUMER waits on an empty queue
    # rather than the frame waiting in it. On the Xavier it settles near 2.2,
    # on a Pi 5 near 3.2 -- the two numbers that had to be maintained by hand.
    # See geoanchor/data_layer/pacer.py for why it paces off stage_ms and not
    # the fix interval (the latter is a feedback loop that converges on the
    # floor).
    #
    # Set a number instead to pin the rate -- benchmarking wants a fixed one,
    # and scripts/feed_fps_sweep.py reproduces the table above.
    fps: auto
    fps_margin: 1.15       # publish period = service time x this
    fps_bounds: [0.5, 10]  # clamp; also the rate used before the first fix
    loop: false
    realtime: true         # false makes a replay run as fast as it can
    device: 0              # uvc: /dev/videoN
    width: 1280
    height: 720
    # MJPG is not a preference, it is the difference between 30 fps and 5 fps.
    # UVC over USB 2.0 cannot carry uncompressed YUYV at these sizes, and the
    # camera responds by dropping the frame rate rather than by refusing, so
    # the only symptom is a feed that is quietly six times too slow. Measured
    # on the Xavier, 4 Sept 2026: YUYV 1280x720 = 10 fps, MJPG 1280x720 = 30.
    fourcc: MJPG           # MJPG | YUYV | "" to accept whatever the driver picks
    frame_px: 512          # long edge used ONLY when altitude or fx_px is missing
    jpeg_quality: 80
    intrinsics:
      # fx_px is the whole story for scale: GSD = altitude / fx_px.
      # Measure it with a calibration board; do not take it from a datasheet.
      # The demo video was generated at fx_px 1200 for a 1280 px frame.
      fx_px: 1200.0
      fy_px: 1200.0
      cx_px: null
      cy_px: null
      dist: null           # [k1, k2, p1, p2, k3] enables undistortion

  gps:
    source: replay         # mavlink | replay | none
    endpoint: udpin:0.0.0.0:14550    # or /dev/ttyTHS0 on the Xavier
    # 921600 with hardware flow control (RTS/CTS) is what NGPS flies. 57600 is
    # a default, not a working value: at 4 Hz with attitude and position
    # streams it backs up, and a backed-up link shows as latency, not as an
    # error. Set SERIALx_BAUD on the autopilot to match.
    baud: 921600
    stale_after_s: 3.0
    heartbeat_timeout_s: 5.0

  envelope:
    agl_min_m: 50
    agl_max_m: 100         # hard project cap; above this a fix is unreliable

# ---------------------------------------------------------------------------
processing_layer:
  # edgepoint2_s64 since 7 Sep 2026. On env80 it is 1.3-1.6x faster than
  # xfeat_mnn (detect 248 -> 149-170 ms) and its failures are far less wild:
  # ungated p90 on Scene_09 is 7.58 m against XFeat's 36.18 m. Must match
  # data_layer.map.method above -- PLE-02 refuses to run if they disagree.
  # s32 and t32 are NOT interchangeable with s64: they lose accuracy on the
  # hard scene and buy no speed, because match cost is the similarity matrix,
  # not the descriptor width.
  method: edgepoint2_s64   # orb | sift | akaze | xfeat_mnn | xfeat_lg
                           # | edgepoint2_s64 | edgepoint2_s32 | edgepoint2_t32
  # 2048 since 7 Sep 2026, for edgepoint2_s64. Three runs each on the live
  # sydney replay, clocks pinned -- frame keypoints halved is strictly better
  # here, not a tradeoff:
  #
  #     k      fixes        latency med       inliers med   error med
  #     4096   22/20/20     722/699/753 ms    506/483/508   0.0051-0.0070 m
  #     2048   29/30/27     535/546/585 ms    484/484/486   0.0056-0.0057 m
  #
  # More fixes BECAUSE it is faster: match cost is linear in frame keypoints,
  # so the layer drops fewer frames while it works. Inliers barely move and sit
  # two orders of magnitude above the gate either way, and the error does not
  # move at all. Revert to 4096 if the method goes back to xfeat_mnn, where
  # k=4096 dominated every lower value on both axes.
  max_keypoints: 2048
  min_keypoints: 30
  min_matches: 12

  # THE rejection rule. Measured 31 Aug 2026 on 1323 fixes: a raw inlier-count
  # threshold beat both NGPS Eq. 7 (0.467) and a learned estimator (0.641) at
  # rejection, with AUC 0.724. It is free and needs no training. Keep the rule.
  #
  # The VALUE moves with the method. 25 was measured against xfeat_mnn;
  # edgepoint2_s64 has no catastrophic cliff to gate away -- its worst env80
  # error is 8.36 m even at gate 6, where xfeat_mnn's is 187 m -- so it wants 8,
  # which accepts 37.4% against xfeat_mnn's 24.5% at xfeat's own best gate of
  # 10. Both from 326 env80 frames, cold start; see CLAUDE.md for the curves.
  #
  # CAVEAT: 8 is measured on CROSS-VIEW SATELLITE. This file's reference is the
  # sydney tile and its feed is synthetic, where inliers run 178-851 and no gate
  # in this range ever binds -- so the value is carried over, not verified here.
  # Re-measure before trusting it on a new reference, as env80.yaml warns.
  inlier_gate: 8
  ransac_reproj_px: 3.0
  rectify: true            # yaw-rectify the frame from attitude before matching
  latency_budget_ms: 250   # ArduPilot clamps VISO_DELAY_MS to 0-250

  search:
    use_prior: true
    # A prior is only worth trusting while the vehicle cannot yet have left the
    # circle being searched: roughly prior_radius_m / max ground speed, so 100 m
    # at 20 m/s is 5 s. Past that it points where the aircraft used to be, and
    # since only an accepted fix refreshes it, a stale one locks the solver out
    # of a map it is still flying over. 0 disables the expiry.
    prior_max_age_s: 5.0
    prior_radius_m: 100    # around the last accepted fix. Drives latency
                           # directly: it decides how many tiles get searched,
                           # and match cost is linear in reference keypoints.
    # 0 = search the whole map when there is no prior. Measured on the Xavier
    # (646x484 frame, xfeat_mnn): 25 tiles = 439 ms of matching, 9 = 112 ms.
    # The cap SWEEPS -- successive cold frames rotate the window, so the whole
    # map is still covered, over ceil(25/9) = 3 frames instead of in one. That
    # trade is only worth taking because a cold start is rare: it happens once
    # at the start and again after a dropped prior, and every frame in between
    # goes down the prior path, which selects by geometry and ignores this.
    cold_start_max_tiles: 9

  covariance:
    # gate_only emits a fixed sigma on whatever survives the gate. It is a
    # PLACEHOLDER and is labelled as one in every record, because the finding
    # is that only a learned estimator produces metres that track actual error
    # (12.0->12.0, 21->21, 38->45) while Eq. 7 understates by 2.4x and
    # saturates at 10 m. Point `model_path` at an exported estimator to switch.
    backend: gate_only     # gate_only | learned
    fixed_sigma_m: 8.0
    clamp_m: [0.1, 100.0]  # EKF3 clamps horizontal to [0.01, 100]; stay inside
    model_path: null

# ---------------------------------------------------------------------------
output_layer:
  pair_window_s: 0.5       # how far apart a fix and a GPS sample may be
  loss: nll                # nll | l2
  alarm_error_m: 50.0

  export:
    flush_every: 20
    # Make session.json answer for itself. The aircraft is GNSS-denied and
    # internet-denied by definition, so nobody is going to be watching the live
    # dashboard while it flies: the file brought back afterwards is the entire
    # record, and it has to open on a laptop with no board and no network.
    include_logs: true     # per-layer step codes -- WHICH steps ran, not just how many
    max_log_rows: 4000     # per layer. Faults are kept in full; steps trim first.
    embed_basemap: true    # the reference tile, downscaled, as a data URI, so the
                           # map view still draws without /api/map.png

  fc:
    # Nothing reaches the vehicle until enabled is true. Turn it on only after
    # VISO_TYPE, VISO_POS_X/Y/Z and EK3_SRC1_POSXY=6 are set on the autopilot.
    enabled: false
    # off    nothing is sent
    # open   the ACTUAL GPS is echoed over the ExternalNav path. Validates the
    #        message, covariance, origin and EKF acceptance with a position
    #        that is already known good, so any failure is a plumbing failure.
    # closed the PREDICTED GPS is sent. The real thing.
    loop_mode: open
    firmware: ardupilot    # ardupilot | px4
    controller: pixhawk6c
    endpoint: udpout:127.0.0.1:14551
    baud: 921600
    # ODOMETRY is ArduPilot's documented preference and carries a quality
    # field. NEVER GPS_INPUT: it has no covariance, which is the whole point.
    message: ODOMETRY      # ODOMETRY | VISION_POSITION_ESTIMATE. Never GPS_INPUT:
                           # it discards covariance, which is the whole point.
    min_quality_inliers: 40   # closed loop needs more than the rejection gate
    require_no_device_errors: true

  # Display only. QGC renders any system it hears a heartbeat from, so this
  # puts a second marker on the map wherever the pipeline thinks the aircraft
  # is, beside where the autopilot thinks it is. Separate socket, separate
  # system id, independent of loop_mode, and it never writes to the autopilot.
  qgc:
    enabled: false
    endpoint: udpout:127.0.0.1:14550   # where QGC is listening
    system_id: 2                        # the autopilot is normally 1
    label: GeoAnchor
    send_origin: false     # send SET_GPS_GLOBAL_ORIGIN once, if the FC has no origin
    origin: null           # [lat, lon]; defaults to the first fix seen

# ---------------------------------------------------------------------------
api:
  host: 0.0.0.0
  port: 8000
  cors_origins: ["*"]
