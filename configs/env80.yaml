# AnyVisLoc env80: real UAV frames over a real satellite reference.
#
#     GEOANCHOR_CONFIG=configs/env80.yaml bash run.sh
#
# Unlike configs/system.yaml this produces numbers that mean something. The
# coordinates are a declared anchor plus a true metric offset, because
# AnyVisLoc ground truth is scene-local and SfM-refined rather than geodetic --
# distances and errors are exact, absolute positions are not real, and the
# session header and dashboard say so.

session:
  tag: env80_scene09
  runs_dir: runs

bus:
  data_pub:       ipc:///tmp/geoanchor/data.sock
  processing_pub: ipc:///tmp/geoanchor/processing.sock
  output_pub:     ipc:///tmp/geoanchor/output.sock
  data_ctl:       ipc:///tmp/geoanchor/data.ctl
  processing_ctl: ipc:///tmp/geoanchor/processing.ctl
  output_ctl:     ipc:///tmp/geoanchor/output.ctl

data_layer:
  map:
    kind: anyvisloc              # geotiff | anyvisloc
    scene_dir: data/AnyVisLoc/Scene_09
    source: data/AnyVisLoc/Scene_09      # kept so config validation passes
    mode: satellite              # satellite | aerial. Satellite is the hard case
                                 # and the one the sweep found sparse matchers
                                 # losing most of their correspondences on.
    anchor: null                 # [lat, lon] for the declared local origin
    store_dir: stores
    method: edgepoint2_s64
    tile_px: 1024
    overlap_px: 128
    max_keypoints: 2048
    rebuild: false

  feed:
    type: env80
    scene_dir: data/AnyVisLoc/Scene_09
    frames_dir: data/AnyVisLoc_env80/Scene_09   # the pre-filtered subset
    mode: satellite
    envelope: true               # apply 50-100 m / >=80 deg here as well, so a
                                 # raw scene folder works without a subset build
    agl_min_m: 50
    agl_max_m: 100
    view_angle_min_deg: 80
    limit: 0                     # >0 to shorten a run
    fps: 2
    loop: false
    realtime: true
    frame_px: 512
    jpeg_quality: 85
    intrinsics: {}               # unused: each frame carries its own K

  gps:
    source: replay               # truth comes from the frame's own pose
    stale_after_s: 3.0

  envelope:
    agl_min_m: 50
    agl_max_m: 100

processing_layer:
  # Used when the LIVE pipeline runs with this config. env80_sweep.py does NOT
  # read it -- its --methods default is its own list -- so a sweep comparing
  # matchers is unaffected by what is set here.
  method: edgepoint2_s64
  max_keypoints: 4096
  min_keypoints: 30
  min_matches: 12
  # THE GATE IS REFERENCE-SPECIFIC, and that is a finding rather than a knob.
  # On the Sydney tile, where frames are cut from the reference itself, XFeat
  # returns 200+ inliers. On a real UAV frame against a real satellite basemap
  # the same matcher returns 12-79 -- measured here on Scene_09, frames 1-3.
  # Sparse detectors stop finding repeatable keypoints across the appearance
  # and scale gap, which is the same effect the s2 sweep measured (RoMa kept
  # 55% of correspondences crossing to satellite, SP+LG 42%, ALIKED 17%).
  # A gate tuned on one reference type silently rejects everything on another,
  # exactly as NGPS Eq. 7 does across descriptors.
  # Retuned 7 Sep 2026 on this file's own data (326 env80 frames, both scenes
  # pooled, cold start) by the rule the sweep prints: take the gate where p99
  # collapses without the accept rate collapsing with it. For xfeat_mnn the
  # collapse is sharp and finishes at 10 --
  #
  #     gate      7      8      9     10     12     15
  #     accept 29.1%  27.6%  27.0%  24.5%  21.8%  18.1%
  #     p99    167.85 18.46   6.75   6.64   6.08   6.08
  #     max    187.42 40.61  18.46   6.75   6.75   6.75
  #
  # -- so 10 is the last gate that buys anything: it is where the maximum error
  # stops being catastrophic, and everything above it trades 3-6 points of
  # accept rate for a few centimetres of p99. The previous 12 was close and not
  # wrong; 10 is where the measurement actually lands.
  #
  # THIS NUMBER IS PER METHOD, not just per reference. edgepoint2_s64 produces
  # no catastrophic outliers at any gate (max 8.36 m even at gate 6), so it
  # wants 8: 37.4% accept at p99 7.38, against xfeat_mnn's 24.5% at its own
  # best gate. Applying 10 to it silently throws away a third of its fixes.
  inlier_gate: 8
  ransac_reproj_px: 3.0
  rectify: true
  latency_budget_ms: 250
  search:
    use_prior: true
    prior_max_age_s: 5.0   # see configs/system.yaml -- a prior has a shelf life
    prior_radius_m: 120
    cold_start_max_tiles: 0
  covariance:
    backend: gate_only
    fixed_sigma_m: 8.0
    clamp_m: [0.1, 100.0]
    model_path: null

output_layer:
  pair_window_s: 0.5
  loss: nll
  alarm_error_m: 50.0
  export:
    flush_every: 20
  fc:
    enabled: false
    loop_mode: open
    firmware: ardupilot
    controller: pixhawk6c
    endpoint: udpout:127.0.0.1:14551
    baud: 921600
    # ODOMETRY is ArduPilot's documented preference and carries a quality
    # field. NEVER GPS_INPUT: it has no covariance, which is the whole point.
    message: ODOMETRY
    min_quality_inliers: 40
    require_no_device_errors: true

  # Display only. QGC renders any system it hears a heartbeat from, so this
  # puts a second marker on the map wherever the pipeline thinks the aircraft
  # is, beside where the autopilot thinks it is. Separate socket, separate
  # system id, independent of loop_mode, and it never writes to the autopilot.
  qgc:
    enabled: false
    endpoint: udpout:127.0.0.1:14550   # where QGC is listening
    system_id: 2                        # the autopilot is normally 1
    label: GeoAnchor

api:
  host: 0.0.0.0
  port: 8000
  cors_origins: ["*"]
